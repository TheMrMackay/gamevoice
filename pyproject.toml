[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamevoice"
version = "1.0.0"
description = "Read any game's on-screen dialogue aloud, giving each character their own voice"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "TheMrMackay" }]
keywords = ["accessibility", "tts", "ocr", "gaming", "screen-reader", "piper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Adaptive Technologies",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "mss>=10.0",
    "numpy>=1.26",
    "Pillow>=10.0",
    "sounddevice>=0.4",
    "pywin32>=306",
    "PySide6>=6.6",
    "piper-tts>=1.7",
    "winrt-Windows.Media.Ocr>=3.2",
    "winrt-Windows.Graphics.Imaging>=3.2",
    "winrt-Windows.Storage.Streams>=3.2",
    "winrt-Windows.Globalization>=3.2",
    "winrt-Windows.Foundation>=3.2",
    "winrt-Windows.Foundation.Collections>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/TheMrMackay/gamevoice"
Issues = "https://github.com/TheMrMackay/gamevoice/issues"

[project.scripts]
gamevoice = "gamevoice.cli:main"

[tool.setuptools]
packages = ["gamevoice", "gamevoice.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the real Windows OCR engine and installed voice models"]
